name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # ⚠️ Las variables VITE_* quedan embebidas en el JS público.
        # Para producción con claves reales, rellena estas secrets en
        # el repo y considera desplegar también el Worker de ai-proxy/.
        env:
          VITE_MINIMAX_API_KEY:  ${{ secrets.VITE_MINIMAX_API_KEY }}
          VITE_MINIMAX_BASE_URL: ${{ secrets.VITE_MINIMAX_BASE_URL }}
          VITE_MINIMAX_MODEL:    ${{ secrets.VITE_MINIMAX_MODEL }}
          VITE_AI_PROXY_URL:     ${{ secrets.VITE_AI_PROXY_URL }}
          VITE_AI_PROXY_TOKEN:   ${{ secrets.VITE_AI_PROXY_TOKEN }}
          VITE_IMAGE_API_URL:    ${{ secrets.VITE_IMAGE_API_URL }}
          VITE_IMAGE_API_KEY:    ${{ secrets.VITE_IMAGE_API_KEY }}
          VITE_IMAGE_MODEL:      ${{ secrets.VITE_IMAGE_MODEL }}
        run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
